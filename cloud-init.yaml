#cloud-config
# devopsy-server: an XFS root for a new server, as its user data
# (README.md, "An XFS root"). Converts the image's ext4 root to XFS on
# the first boots, so every file on the server can be copied with
# reflinks, then leaves a plain Debian: the XFS root as partition 1, the
# image's ext4 kept as a 2 GiB /boot (GRUB never reads XFS) and nothing
# of devopsy's behind. Then run setup.sh as usual. Written for
# DigitalOcean's Debian 13 image (GPT, root=PARTUUID=..., GRUB for BIOS
# and EFI through grub-cloud-amd64).
#
# Boot 1 (cloud-init): the image's initramfs (growroot) has grown the
# root over the whole disk already. Install a GRUB core that finds the
# ext4 by its UUID, valid through every phase below (the image's finds
# it by partition number, which phase 4 changes), put a one-time
# conversion into the initramfs and reboot.
# Boot 2 (initramfs, before the root is mounted), in phases that each
# survive a cut and resume on the next boot:
# 1. shrink the ext4 to 2 GiB and make the rest a partition;
# 2. mkfs.xfs it and copy the whole root into it (the ext4 stays the
#    root until phase 4: a failure up to here boots on as before);
# 3. strip the ext4 to /boot's files at its top, with boot -> . so GRUB
#    finds /boot/grub there as it always did;
# 4. in one write of the partition table, make the XFS the root: the
#    root's partition number (1: DigitalOcean's restore of a snapshot
#    expects the root there, and fails otherwise) and its PARTUUID (the
#    kernel's root=PARTUUID=..., GRUB's config and fstab untouched).
#    Then reboot.
# The XFS partition's GPT name holds the phase: devopsy-new,
# devopsy-copied, devopsy-stripped, devopsy-root (done: nothing,
# ever). Messages go to the serial console.
# Boot 3: a plain boot on XFS. A per-boot script empties the copy of
# /boot the root kept under its mount point, removes the conversion and
# itself, and reinstalls GRUB as its updates do.
# Later: a disk resize grows the root as on any Debian (growroot,
# cloud-init's resizefs and systemd's growfs all grow XFS), and kernel
# and GRUB updates write /boot as they always did.
packages: [xfsprogs, gdisk]
write_files:
  - path: /etc/initramfs-tools/hooks/devopsy-xfs
    permissions: "0755"
    content: |
      #!/bin/sh
      case $1 in prereqs) echo ""; exit 0;; esac
      . /usr/share/initramfs-tools/hook-functions
      [ -x /etc/initramfs-tools/scripts/local-premount/devopsy-xfs ] || exit 0
      manual_add_modules xfs ext4
      # GNU's and util-linux's, never the initramfs's own (klibc's).
      mkdir -p "$DESTDIR/devopsy/bin"
      for b in /usr/sbin/e2fsck /usr/sbin/resize2fs /usr/sbin/sgdisk /usr/sbin/blockdev \
        /usr/sbin/blkid /usr/sbin/mkfs.xfs /usr/bin/cp /usr/bin/mv /usr/bin/ln /usr/bin/rm \
        /usr/bin/mount /usr/bin/umount /usr/bin/mawk /usr/bin/sed; do
        copy_exec "$b" /devopsy/bin
      done
      ln -sf mawk "$DESTDIR/devopsy/bin/awk"
  - path: /etc/initramfs-tools/scripts/local-premount/devopsy-xfs
    permissions: "0755"
    content: |
      #!/bin/sh
      # One-time conversion of the root to XFS (see the top of cloud-init.yaml).
      case $1 in prereqs) echo ""; exit 0;; esac
      . /scripts/functions
      PATH=/devopsy/bin:$PATH
      say() { echo "devopsy-xfs: $*" >/dev/kmsg 2>/dev/null || echo "devopsy-xfs: $*"; }
      root=$(resolve_device "$ROOT") && [ -b "$root" ] || { say "no root device ($ROOT)"; exit 0; }
      sys=/sys/class/block/${root##*/}
      [ -f "$sys/partition" ] || { say "$root is no partition"; exit 0; }
      disk=$(cd -P "$sys/.." && echo "/dev/${PWD##*/}")
      table=$(sgdisk -p "$disk") || { say "cannot read $disk"; exit 0; }
      name_of() { echo "$table" | awk -v n="$1" '$1 ~ /^[0-9]+$/ && $7 == n { print $1 }'; }
      dev_of() {
        for p in /sys/class/block/"${disk##*/}"/*/partition; do
          n=; read -r n <"$p" 2>/dev/null
          [ "$n" = "$1" ] && { d=${p%/partition}; echo "/dev/${d##*/}"; return; }
        done
      }
      field() { sgdisk -i "$1" "$disk" | sed -n "s/^$2: \([0-9A-Fa-f-]*\).*/\1/p"; }
      [ -n "$(name_of devopsy-root)" ] && exit 0
      bnum=$(name_of devopsy-boot)
      state=
      for s in new copied stripped; do
        xnum=$(name_of devopsy-$s)
        [ -n "$xnum" ] && { state=$s; break; }
      done
      if [ -z "$state" ]; then
        # Phase 1: shrink the ext4 to 2 GiB, the rest a new partition.
        [ -z "$bnum" ] || { say "devopsy-boot without its XFS partition, not converting"; exit 0; }
        read -r bnum <"$sys/partition"
        [ "$(blkid -p -s TYPE -o value "$root")" = ext4 ] || { say "$root is not ext4, not converting"; exit 0; }
        ss=$(echo "$table" | sed -n 's|^Sector size (logical/physical): \([0-9]*\)/.*|\1|p')
        last=$(echo "$table" | sed -n 's/.*last usable sector is \([0-9]*\).*/\1/p')
        start=$(field "$bnum" "First sector")
        type=$(field "$bnum" "Partition GUID code")
        uuid=$(field "$bnum" "Partition unique GUID")
        [ -n "$ss" ] && [ -n "$last" ] && [ -n "$start" ] && [ -n "$type" ] && [ -n "$uuid" ] ||
          { say "cannot read partition $bnum"; exit 0; }
        gib=$((1073741824 / ss))
        end=$((start + 2 * gib - 1))
        # Everything after the root must be free (it is: growroot made the
        # root the last partition), with 4 GiB at least for the XFS.
        if echo "$table" | awk -v e="$end" '$1 ~ /^[0-9]+$/ && $2 > e { f=1 } END { exit !f }'; then
          say "a partition follows the root, not converting"; exit 0
        fi
        [ $((last - end)) -ge $((4 * gib)) ] || { say "disk too small, not converting"; exit 0; }
        xnum=1; while echo "$table" | awk -v n="$xnum" '$1 == n { f=1 } END { exit !f }'; do xnum=$((xnum + 1)); done
        say "shrinking $root to 2G, XFS partition $xnum on $disk"
        e2fsck -fy "$root"; rc=$?
        [ "$rc" -le 1 ] || { say "e2fsck failed ($rc), not converting"; exit 0; }
        resize2fs "$root" 2G || { say "resize2fs failed, not converting"; exit 0; }
        # The same start, type and PARTUUID: still the root until phase 4.
        sgdisk -d "$bnum" -n "$bnum:$start:$end" -t "$bnum:$type" -u "$bnum:$uuid" -c "$bnum:devopsy-boot" \
          -n "$xnum:$((end + 1)):$last" -t "$xnum:8300" -c "$xnum:devopsy-new" "$disk" ||
          { say "sgdisk failed, not converting"; exit 0; }
        blockdev --rereadpt "$disk" || true
        wait_for_udev 10
        state=new
      fi
      boot=$(dev_of "$bnum"); xfs=$(dev_of "$xnum")
      if [ -z "$boot" ] || [ -z "$xfs" ] || [ ! -b "$boot" ] || [ ! -b "$xfs" ]; then
        say "the kernel kept the old table, rebooting"; sync; reboot -f
      fi
      mkdir -p /devopsy/boot /devopsy/root
      b=/devopsy/boot
      if [ "$state" = new ]; then
        # Phase 2: the whole root into a new XFS, its fstab rewritten.
        say "copying the root into XFS on $xfs"
        mkfs.xfs -f "$xfs" || { say "mkfs.xfs failed, booting on ext4"; exit 0; }
        mount -t ext4 -o ro "$boot" "$b" || { say "cannot mount $boot, booting on ext4"; exit 0; }
        mount -t xfs "$xfs" /devopsy/root || { umount "$b"; say "cannot mount $xfs, booting on ext4"; exit 0; }
        bootfs=$(blkid -p -s UUID -o value "$boot")
        if cp -ax "$b/." /devopsy/root/ && [ -n "$bootfs" ] &&
          awk -v b="$bootfs" '$2 == "/" { $3 = "xfs"; $4 = "defaults,x-systemd.growfs"; $6 = 0; print;
            print "UUID=" b " /boot ext4 defaults,nofail,discard,errors=remount-ro 0 2"; next } { print }' \
            "$b/etc/fstab" >/devopsy/root/etc/fstab; then
          umount /devopsy/root; umount "$b"
        else
          umount /devopsy/root; umount "$b"; say "the copy failed, booting on ext4"; exit 0
        fi
        sync
        sgdisk -c "$xnum:devopsy-copied" "$disk" || { say "sgdisk failed, booting on ext4"; exit 0; }
        state=copied
      fi
      if [ "$state" = copied ]; then
        # Phase 3: the ext4 holds /boot's files at its top, with boot -> .
        # Every step leaves GRUB's /boot/grub there: the files are linked
        # up before one rename swaps the directory for the link. Cut from
        # here on, the next boot comes back here before it needs a root.
        say "making $boot /boot"
        mount -t ext4 "$boot" "$b" || { say "cannot mount $boot"; exit 0; }
        if [ ! -L "$b/boot" ]; then
          for e in "$b"/* "$b"/.[!.]* "$b"/..?*; do
            [ -e "$e" ] || [ -L "$e" ] || continue
            case ${e##*/} in boot|lost+found) ;; *) rm -rf "$e" ;; esac
          done
          cp -al "$b/boot/." "$b/" && ln -s . "$b/.devopsy-boot" && mv -T --exchange "$b/.devopsy-boot" "$b/boot" ||
            { umount "$b"; say "cannot move /boot's files"; exit 0; }
        fi
        rm -rf "$b/.devopsy-boot"
        umount "$b"
        sync
        sgdisk -c "$xnum:devopsy-stripped" "$disk" || { say "sgdisk failed"; exit 0; }
      fi
      # Phase 4: the XFS takes the root's number and PARTUUID, the ext4
      # the XFS's number and a new PARTUUID, in one write.
      bstart=$(field "$bnum" "First sector"); bend=$(field "$bnum" "Last sector")
      xstart=$(field "$xnum" "First sector"); xend=$(field "$xnum" "Last sector")
      type=$(field "$bnum" "Partition GUID code"); uuid=$(field "$bnum" "Partition unique GUID")
      [ -n "$bstart" ] && [ -n "$bend" ] && [ -n "$xstart" ] && [ -n "$xend" ] && [ -n "$type" ] && [ -n "$uuid" ] ||
        { say "cannot read the partitions"; exit 0; }
      say "making $xfs the root"
      sgdisk -d "$bnum" -d "$xnum" -n "$bnum:$xstart:$xend" -t "$bnum:$type" -u "$bnum:$uuid" -c "$bnum:devopsy-root" \
        -n "$xnum:$bstart:$bend" -t "$xnum:8300" -u "$xnum:R" -c "$xnum:devopsy-boot" "$disk" ||
        { say "sgdisk failed"; exit 0; }
      say "done, rebooting"
      sync; reboot -f
  - path: /var/lib/cloud/scripts/per-boot/devopsy-xfs-finish
    permissions: "0755"
    content: |
      #!/bin/sh
      # Once the server runs on XFS: empties the copy of /boot under its
      # mount point (immutable from then on, so nothing writes there with
      # /boot missing), removes the conversion and this script, and
      # reinstalls GRUB as its updates do (grub-cloud-amd64: the BIOS core
      # by partition number again, the EFI one, its config).
      set -eu
      say() { echo "$(date -u '+%F %T') devopsy-xfs: $*"; }
      # Only once the conversion is done. Said on every boot until then:
      # on a later boot than the first, the conversion failed before its
      # copy (the serial console says why) and runs again on the next.
      if [ "$(lsblk -no PARTLABEL "$(findmnt -no SOURCE /)")" != devopsy-root ]; then
        say "the root is still $(findmnt -no FSTYPE /), the conversion runs on the next boot"
        exit 0
      fi
      [ "$(findmnt -no FSTYPE /boot)" = ext4 ] || { say "/boot is not mounted" >&2; exit 1; }
      say "finishing the conversion"
      mkdir -p /run/devopsy-xfs
      mount --bind / /run/devopsy-xfs
      chattr -i /run/devopsy-xfs/boot
      find /run/devopsy-xfs/boot -mindepth 1 -delete
      chattr +i /run/devopsy-xfs/boot
      umount /run/devopsy-xfs
      rm -f /etc/initramfs-tools/hooks/devopsy-xfs /etc/initramfs-tools/scripts/local-premount/devopsy-xfs
      update-initramfs -u -k all
      if dpkg -s grub-cloud-amd64 >/dev/null 2>&1; then
        dpkg-reconfigure -f noninteractive grub-cloud-amd64
      fi
      update-grub
      rm -f "$0"
      say "done, the root is XFS"
runcmd:
  - |
    # The GRUB core that finds the ext4 by UUID, then the conversion into
    # the initramfs; either failing, nothing of it is left to run later.
    say() { echo "$(date -u '+%F %T') devopsy-xfs: $*"; }
    if disk=/dev/$(lsblk -no PKNAME "$(findmnt -no SOURCE /)") && fs=$(findmnt -no UUID /) &&
      printf 'search.fs_uuid %s root\nset prefix=($root)/boot/grub\n' "$fs" >/run/devopsy-xfs.cfg &&
      grub-mkimage -O i386-pc -o /boot/grub/i386-pc/core.img -c /run/devopsy-xfs.cfg -p /boot/grub \
        biosdisk part_gpt ext2 search_fs_uuid &&
      /usr/lib/grub/i386-pc/grub-bios-setup -d /boot/grub/i386-pc "$disk" &&
      update-initramfs -u; then
      say "converting on the next boot"
    else
      say "not converting" >&2
      rm -f /etc/initramfs-tools/hooks/devopsy-xfs /etc/initramfs-tools/scripts/local-premount/devopsy-xfs \
        /var/lib/cloud/scripts/per-boot/devopsy-xfs-finish
      update-initramfs -u
    fi
power_state:
  mode: reboot
  condition: true
