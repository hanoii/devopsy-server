#cloud-config
# devopsy-server: a data partition for a new server, as its user data
# (README.md, "A data partition"). Splits the server's one disk: an ext4
# root of ROOT_GB GiB (below) for the system, Docker's images and build
# cache, and the rest an XFS partition with reflinks on /srv, for
# releases (DEVOPSY_ROOT=/srv/devopsy) and Docker's named volumes
# (/srv/docker-volumes, bound onto /var/lib/docker/volumes). Then run
# setup.sh as usual.
#
# Boot 1 (cloud-init): the image's initramfs (growroot) has grown the
# root over the whole disk already. Turn growroot off, put a one-time
# split into the initramfs, write the mounts and reboot.
# Boot 2 (initramfs, before the root is mounted): shrink the root's ext4
# to ROOT_GB, rewrite its partition at the same start with the same
# PARTUUID (root=PARTUUID=... on the kernel's line), make the rest a
# partition, mkfs.xfs it, name it devopsy-data, reboot. Every failure
# boots on as before, unsplit; its messages are on the serial console.
# Boot 3: a plain boot, /srv mounted. From then on the initramfs script
# sees the devopsy-data partition and does nothing.
# A disk resize later: growpart grows the data partition (the root sits
# before it) and a per-boot script grows its XFS; no-ops otherwise.
#
# Nothing writes onto the root disk when /srv is missing: its empty
# mount points are immutable, and Docker waits for both mounts.
growpart:
  mode: auto
  devices: [/srv]
  # /etc/growroot-disabled (below) turns cloud-init's growpart off too.
  ignore_growroot_disabled: true
resize_rootfs: false
packages: [xfsprogs, gdisk]
write_files:
  # The root's size in GiB; the rest of the disk is /srv. 20 for a server
  # that pulls its images, 25 or more for one that builds them (Docker's
  # images and build cache stay on the root). It cannot grow later: a
  # root that runs short is a rebuild with a larger value.
  - path: /etc/devopsy-data.conf
    content: |
      ROOT_GB=20
  - path: /etc/growroot-disabled
    content: ""
  - path: /etc/initramfs-tools/hooks/devopsy-data
    permissions: "0755"
    content: |
      #!/bin/sh
      case $1 in prereqs) echo ""; exit 0;; esac
      . /usr/share/initramfs-tools/hook-functions
      [ -f /etc/devopsy-data.conf ] || exit 0
      cp /etc/devopsy-data.conf "$DESTDIR/conf/devopsy-data.conf"
      for b in e2fsck resize2fs sgdisk blockdev blkid mkfs.xfs; do
        copy_exec "/usr/sbin/$b" /sbin
      done
      # Not in every initramfs (no busybox).
      copy_exec /usr/bin/mawk /bin/awk
      copy_exec /usr/bin/sed /bin/sed
  - path: /etc/initramfs-tools/scripts/local-premount/devopsy-data
    permissions: "0755"
    content: |
      #!/bin/sh
      # One-time split of the root disk (see the top of cloud-init.yaml). State is
      # the data partition's GPT name: none yet (shrink and partition),
      # devopsy-new (make XFS), devopsy-data (done: nothing, ever).
      case $1 in prereqs) echo ""; exit 0;; esac
      [ -f /conf/devopsy-data.conf ] || exit 0
      . /scripts/functions
      . /conf/devopsy-data.conf
      say() { echo "devopsy-data: $*" >/dev/kmsg 2>/dev/null || echo "devopsy-data: $*"; }
      root=$(resolve_device "$ROOT") && [ -b "$root" ] || { say "no root device ($ROOT)"; exit 0; }
      sys=/sys/class/block/${root##*/}
      [ -f "$sys/partition" ] || { say "$root is no partition"; exit 0; }
      read -r num <"$sys/partition"
      disk=$(cd -P "$sys/.." && echo "/dev/${PWD##*/}")
      changed=
      table=$(sgdisk -p "$disk") || { say "cannot read $disk"; exit 0; }
      name_of() { echo "$table" | awk -v n="$1" '$1 ~ /^[0-9]+$/ && $7 == n { print $1 }'; }
      [ -n "$(name_of devopsy-data)" ] && exit 0
      dnum=$(name_of devopsy-new)
      if [ -z "$dnum" ]; then
        # Phase 1: shrink and partition.
        [ "$(blkid -p -s TYPE -o value "$root")" = ext4 ] || { say "$root is not ext4"; exit 0; }
        ss=$(echo "$table" | sed -n 's|^Sector size (logical/physical): \([0-9]*\)/.*|\1|p')
        last=$(echo "$table" | sed -n 's/.*last usable sector is \([0-9]*\).*/\1/p')
        info=$(sgdisk -i "$num" "$disk")
        start=$(echo "$info" | sed -n 's/^First sector: \([0-9]*\).*/\1/p')
        type=$(echo "$info" | sed -n 's/^Partition GUID code: \([0-9A-Fa-f-]*\).*/\1/p')
        uuid=$(echo "$info" | sed -n 's/^Partition unique GUID: //p')
        pname=$(echo "$info" | sed -n "s/^Partition name: '\(.*\)'$/\1/p")
        [ -n "$ss" ] && [ -n "$last" ] && [ -n "$start" ] && [ -n "$type" ] && [ -n "$uuid" ] || { say "cannot read partition $num"; exit 0; }
        gib=$((1073741824 / ss))
        end=$((start + ROOT_GB * gib - 1))
        # Everything after the root must be free (it is: growroot made the
        # root the last partition) and leave 1 GiB at least.
        if echo "$table" | awk -v e="$end" '$1 ~ /^[0-9]+$/ && $2 > e { f=1 } END { exit !f }'; then
          say "a partition follows the root, not splitting"; exit 0
        fi
        [ $((last - end)) -ge "$gib" ] || { say "disk too small for ROOT_GB=$ROOT_GB"; exit 0; }
        dnum=1; while echo "$table" | awk -v n="$dnum" '$1 == n { f=1 } END { exit !f }'; do dnum=$((dnum + 1)); done
        say "shrinking $root to ${ROOT_GB}G, data partition $dnum on $disk"
        e2fsck -fy "$root"; rc=$?
        [ "$rc" -le 1 ] || { say "e2fsck failed ($rc), not splitting"; exit 0; }
        resize2fs "$root" "${ROOT_GB}G" || { say "resize2fs failed, not splitting"; exit 0; }
        sgdisk -d "$num" -n "$num:$start:$end" -t "$num:$type" -u "$num:$uuid" ${pname:+-c "$num:$pname"} \
          -n "$dnum:$((end + 1)):$last" -t "$dnum:8300" -c "$dnum:devopsy-new" "$disk" || { say "sgdisk failed, not splitting"; exit 0; }
        changed=1
        blockdev --rereadpt "$disk" || true
        wait_for_udev 10
      fi
      # Phase 2: make XFS on the new partition (also after a reboot, when
      # the kernel could not reread the table in phase 1).
      data=
      for p in /sys/class/block/"${disk##*/}"/*/partition; do
        n=; read -r n <"$p" 2>/dev/null
        [ "$n" = "$dnum" ] && { d=${p%/partition}; data=/dev/${d##*/}; }
      done
      if [ -z "$data" ] || [ ! -b "$data" ]; then
        # Only a table changed in this boot is worth a reboot (no loop).
        [ -n "$changed" ] || { say "no device for partition $dnum"; exit 0; }
        say "the kernel kept the old table, rebooting"; sync; reboot -f
      fi
      say "making XFS on $data"
      mkfs.xfs -f ${DATA_UUID:+-m uuid=$DATA_UUID} "$data" || { say "mkfs.xfs failed"; exit 0; }
      sgdisk -c "$dnum:devopsy-data" "$disk"
      say "done, rebooting"
      sync; reboot -f
  # Docker's named volumes on /srv's XFS, so they reflink with the data
  # there: its directory, made once /srv is mounted, before the bind
  # (fstab, below).
  - path: /etc/systemd/system/devopsy-docker-volumes.service
    content: |
      [Unit]
      Description=Docker's named volumes directory on /srv
      Requires=srv.mount
      After=srv.mount
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/bin/install -d -m 701 /srv/docker-volumes
  # Docker starts only with both mounts there, never on the root disk.
  - path: /etc/systemd/system/docker.service.d/devopsy-data.conf
    content: |
      [Unit]
      RequiresMountsFor=/srv /var/lib/docker/volumes
  - path: /var/lib/cloud/scripts/per-boot/devopsy-data-grow
    permissions: "0755"
    content: |
      #!/bin/sh
      # Grows the XFS over its partition after a disk resize (growpart,
      # above, grows the partition); a no-op without new space.
      mountpoint -q /srv && xfs_growfs /srv
runcmd:
  - echo "DATA_UUID=$(cat /proc/sys/kernel/random/uuid)" >>/etc/devopsy-data.conf
  # Before cloud-init's network stage, which runs growpart on /srv.
  - . /etc/devopsy-data.conf && echo "UUID=$DATA_UUID /srv xfs defaults,nofail,x-systemd.before=cloud-init-network.service 0 2" >>/etc/fstab
  - echo "/srv/docker-volumes /var/lib/docker/volumes none bind,nofail,x-systemd.requires=devopsy-docker-volumes.service 0 0" >>/etc/fstab
  # Immutable while unmounted: nothing writes into the root's /srv or
  # /var/lib/docker/volumes when the XFS is missing.
  - mkdir -p /srv /var/lib/docker/volumes && chattr +i /srv /var/lib/docker/volumes
  - update-initramfs -u
power_state:
  mode: reboot
  condition: true
